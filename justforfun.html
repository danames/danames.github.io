<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just for Fun - Dan Ames</title>
<style>
  body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
  .container { max-width: 600px; margin: auto; padding: 20px; }
  .profile { text-align: center; margin: 20px 0; }
  .profile img { width: 100px; height: 100px; border-radius: 50%; }
  .profile h1 { margin: 10px 0; }
  .section {
    text-align: center;
    margin: 20px 0;
    font-weight: bold;
    font-size: 1.2em;
  }
  .link-item {
    display: flex;
    align-items: center;
    background-color: #fff;
    margin: 10px 0;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    text-decoration: none;
  }
  .link-item img {
    width: 50px;
    height: 50px;
    margin: 10px;
    border-radius: 5px;
  }
  .link-item div {
    flex-grow: 1;
  }
  .link-item a {
    display: block;
    color: #333;
    padding: 15px 20px;
    text-decoration: none;
  }
  .link-item:hover { background-color: #e9e9e9; }
  .back-link { display: block; margin: 20px 0; color: #666; text-decoration: none; }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← Back to Home</a>
  <div class="profile">
    <img src="images/danames_small.jpg" alt="Profile Picture">
    <h1>Dr. Dan Ames</h1>
    <p>Just for Fun</p>
  </div>
  <div class="section">
    <p>Games</p>
  </div>
  <div class="link-item">
    <img src="images/wordle_logo.svg" alt="Wordle">
    <div><a href="games/wordle/">Wordle</a></div>
  </div>
</div>
</body>
</html>
